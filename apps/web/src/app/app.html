<!-- Before the chrome: a keyboard user should be able to step over the whole
     rail, which grows one entry per conversation, and land in the content. -->
<a class="skip-link" href="#main-content" (click)="skipToContent()">Skip to main content</a>

<!-- The deck: this app's window chrome, clear glass along the top of the
     window. The window is undecorated, so the title bar, the controls and the
     drag surface are all drawn here.
     `data-tauri-drag-region` applies to the element carrying it, so the bar's
     own surface moves the window while the controls on it keep working. -->
<header class="deck" data-tauri-drag-region>
  <div class="deck__bar" data-tauri-drag-region>
    <div class="deck__end" data-tauri-drag-region>
      @if (desktop.controlsOnLeft) {
        <app-window-controls />
      }

      <!-- While the rail is open its toggle lives in the rail's foot; only a
           closed rail needs a way back from up here. -->
      @if (!railOpen()) {
        <button
          class="glyph"
          type="button"
          aria-label="Show the rail"
          aria-expanded="false"
          [matTooltip]="'Show the rail  ' + commandKey + 'B'"
          matTooltipPosition="below"
          (click)="toggleRail()"
        >
          <mat-icon>left_panel_open</mat-icon>
        </button>
      }
    </div>

    <!-- Centred on the window, as a search field is on the Mac: reads as a
         field but is a button that opens the palette. -->
    <button
      class="command"
      [attr.aria-label]="'Search chats, agents and memory, ' + commandKey + 'K'"
      (click)="openPalette()"
    >
      <mat-icon class="command__icon">search</mat-icon>
      <span class="command__label">Search</span>
      <kbd class="command__key">{{ commandKey }}K</kbd>
    </button>

    <div class="deck__end deck__end--right" data-tauri-drag-region>
      <app-fleet-status />

      <app-spend-meter />

      <!-- The person, at the end of the bar: the one control here that is about
         you rather than about the workspace. -->
      <a
        class="identity"
        routerLink="/profile"
        routerLinkActive="identity--active"
        [matTooltip]="user.displayName() + ' · Profile'"
        matTooltipPosition="below"
        [attr.aria-label]="'Profile of ' + user.displayName()"
      >
        <gb-avatar [name]="user.displayName()" [imageUrl]="user.pictureUrl()" size="small" />
      </a>

      @if (desktop.isDesktop && !desktop.controlsOnLeft) {
        <app-window-controls />
      }
    </div>
  </div>
</header>

@if (desktop.needsResizeEdges) {
  <!-- An undecorated window keeps no resize border of its own on Windows and
       Linux, so the app supplies the hit areas. macOS still resizes from the
       window's edges and needs none of this. -->
  <div class="resize" aria-hidden="true">
    @for (edge of resizeEdges; track edge.direction) {
      <span
        class="resize__edge resize__edge--{{ edge.name }}"
        (mousedown)="startResize($event, edge.direction)"
      ></span>
    }
  </div>
}

<div class="workspace" [class.workspace--rail-open]="railOpen()">
  @if (railOpen() && !wideLayout()) {
    <button class="scrim" type="button" aria-label="Close the rail" (click)="toggleRail()"></button>
  }

  <nav class="rail" [class.rail--overlay]="!wideLayout()" aria-label="Workspace">
    <app-conversation-rail
      [commandKey]="commandKey"
      (navigated)="closeRailOnNarrow()"
      (hide)="toggleRail()"
    />
  </nav>

  <!-- The routed surface scrolls as a whole for a page, and not at all for a
       conversation, which fills it and scrolls its own transcript. -->
  <!-- The sheet: the one opaque-ish surface in the window, laid on the glass
       so what is read never sits on the desktop behind it. Its top edge
       reports the fleet. -->
  <div class="sheet">
    <app-fleet-spine class="sheet__spine" />
    <main #mainContent id="main-content" class="surface" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
